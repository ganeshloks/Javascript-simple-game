<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
        <style>
        button{
            display: inline-block;
        height: 100px;
        font-size: 15px;
        font-weight: bold;
        transition: 0.3s;
        padding: 20px;
        }

        button:hover{
        transform: scale(1.2);
        background-color: red;

        }

        .namba:hover{
            background-color:darkred ;
            
        }
       
        </style>
        </head>
        <body>
           
        <p>Rock paper Scissors</p>

        <!-- Button 1 (Rock) -->
        <button onclick="
        playGame('rock')
        ">Rock</button>

        <!-- Button 2 (paper) -->
        <button onclick="
           playGame('Paper')">Paper</button>

    <!-- Button 3 (Scissors) -->
        <button onclick="
      playGame('Scissors')
        ">Scissors</button>

        <button class="namba" onclick="
        score.wins=0;
        score.losses=0;
        score.ties=0;
        localStorage.removeItem('score')
        alert(`Scores are resetted
Wins:${score.wins} losses:${score.losses} ties:${score.ties}`)
            updatescore();
        ">Reset Score</button>
        <p class="Js-result"></p>
        <p class="Js-moves"></p>
        <p class="Js-Score-Display"></p>

<!-- Start of Script tag -->
<script>

// First function for playermove 
// inside it has a second function is called for computermove
let score=
    JSON.parse (localStorage.getItem('score'))||
    {
            wins:0,
            losses:0,
            ties:0
        };

        updatescore();
    // if(score===null){
    //     score={
    //         wins:0,
    //         losses:0,
    //         ties:0
    //     };
    // }



function playGame(playermove){
        const computermove=ComputerMovePick();
        let result='';
        if(playermove==='Scissors'){
            if(computermove=== 'rock'){
        result='you lose';
        }else if(computermove=== 'Paper'){
        result='you win';
        }else if(computermove=== 'Scissors'){
        result='its a tie';
        } 
        }else if(playermove==='Paper'){
           
        if(computermove=== 'rock'){
        result='you win';
        }else if(computermove=== 'Paper'){
        result='its a tie';
        }else if(computermove=== 'Scissors'){
        result='you lose';
        }
        }else if(playermove==='rock'){
            
        if(computermove==='rock'){
        result='its a tie';
        }else if(computermove=== 'Paper'){
        result='you lose';
        }else if(computermove=== 'Scissors'){
        result='you win';
        }
        }
        if(result==='you win'){
            score.wins+=1;
        }else if(result==='you lose'){
            score.losses+=1;
        }else if(result==='its a tie'){
            score.ties+=1;
        }

        localStorage.setItem('score', JSON.stringify(score));

        updatescore();
        document.querySelector('.Js-result').innerHTML= result;
        
        document.querySelector('.Js-moves').innerHTML=`you ${playermove} - ${computermove} computer`;
        }
       

        function updatescore(){
            document.querySelector('.Js-Score-Display')
        .innerHTML=`wins:${score.wins} losses:${score.losses} ties:${score.ties}`;
        }
       
        // End of first function
       
        // Second function
    function ComputerMovePick(){
        
        const randomnumber=Math.random();
        let computermove='';
        
        if(randomnumber>=0 && randomnumber<=1/3){
        computermove='rock';
        }else if(randomnumber>=1/3 && randomnumber<=2/3){
        computermove='Paper';
        }else if(randomnumber>2/3 && randomnumber<1){
        computermove='Scissors';
        }
        return computermove;
    }
</script>
        </body>
        </html>
