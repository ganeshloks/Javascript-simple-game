<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
        <link
        rel="stylesheet"
        href="styles.css">
        </head>
        <body>
       <div class="formatting">   
        <p class="Titlechange">Rock paper Scissors</p>

        <!-- Button 1 (Rock) -->
        <button onclick="
        playGame('rock');
        " class="buttonmass"><img src="./images/rock-emoji.png" class="buttonstyle"</button>

        <!-- Button 2 (paper) -->
        <button onclick="
           playGame('paper')" class="buttonmass"><img src="./images/paper-emoji.png" class="buttonstyle"</button>

    <!-- Button 3 (Scissors) -->
        <button onclick="
      playGame('scissors')
        " class="buttonmass"><img src="./images/scissors-emoji.png" class="buttonstyle"></button>

        <button class="namba" onclick="
        score.wins=0;
        score.losses=0;
        score.ties=0;
        localStorage.removeItem('score');
        resetmsg();
            updatescore();
        ">Reset Score</button>

        <button onclick="
        autoplay();
        " class="play-yourself clean">Auto Play</button>




        <p class="Js-result result"></p>
        <p class="Js-moves ">
        </p>
        <p class="Js-Score-Display scores"></p>
       </div>

<!-- Start of Script tag -->
<script src="./index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
        </body>
        </html>
